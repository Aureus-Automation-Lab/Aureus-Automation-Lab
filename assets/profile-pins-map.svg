<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Aureus profile pins map</title>
  <desc id="desc">Recommended public-safe GitHub pin strategy for the profile.</desc>
  <rect width="1280" height="520" rx="36" fill="#08111F"/>
  <text x="76" y="92" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Profile Pins</text>
  <text x="76" y="130" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Pin only polished, public-safe proof surfaces. Private repos belong in controlled walkthroughs.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="80" y="190" width="330" height="92" rx="22" fill="#101923" stroke="#2C6F69"/>
    <text x="112" y="244" fill="#68F2D8" font-size="22" font-weight="900">1. Profile repo</text>
    <rect x="475" y="190" width="330" height="92" rx="22" fill="#101923" stroke="#315F87"/>
    <text x="507" y="244" fill="#91D8FF" font-size="22" font-weight="900">2. AOP architecture</text>
    <rect x="870" y="190" width="330" height="92" rx="22" fill="#101923" stroke="#8B6C2C"/>
    <text x="902" y="244" fill="#FFE28A" font-size="22" font-weight="900">3. Automation map</text>
    <rect x="80" y="330" width="330" height="92" rx="22" fill="#101923" stroke="#8B6C2C"/>
    <text x="112" y="384" fill="#FFE28A" font-size="22" font-weight="900">4. Invoice flow</text>
    <rect x="475" y="330" width="330" height="92" rx="22" fill="#101923" stroke="#7A5CF5"/>
    <text x="507" y="384" fill="#CDBDFF" font-size="22" font-weight="900">5. Web Studio demo</text>
    <rect x="870" y="330" width="330" height="92" rx="22" fill="#101923" stroke="#2C6F69"/>
    <text x="902" y="384" fill="#68F2D8" font-size="22" font-weight="900">6. Template / proof</text>
  </g>
</svg>
