<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">FineCon invoice flow</title>
  <desc id="desc">Public-safe invoice workflow map showing intake, extraction, review, validation, POHODA boundary and evidence.</desc>
  <rect width="980" height="360" rx="26" fill="#081018"/>
  <text x="54" y="62" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="850">FineCon / Invoice Direction</text>
  <text x="54" y="96" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Document workflow with POHODA and accounting review boundaries.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" font-size="14">
    <rect x="68" y="170" width="120" height="62" rx="15" fill="#11231F" stroke="#4CE0B5"/><text x="128" y="207" text-anchor="middle" fill="#E5FFF0">intake</text>
    <rect x="228" y="170" width="120" height="62" rx="15" fill="#111B2A" stroke="#71C7FF"/><text x="288" y="207" text-anchor="middle" fill="#E8F6FF">extraction</text>
    <rect x="388" y="170" width="120" height="62" rx="15" fill="#151424" stroke="#A97CFF"/><text x="448" y="207" text-anchor="middle" fill="#F0E6FF">review</text>
    <rect x="548" y="170" width="120" height="62" rx="15" fill="#241B0F" stroke="#FFC857"/><text x="608" y="207" text-anchor="middle" fill="#FFF4C7">validation</text>
    <rect x="708" y="170" width="150" height="62" rx="15" fill="#2A1115" stroke="#F76F8E"/><text x="783" y="207" text-anchor="middle" fill="#FFE0E8">POHODA boundary</text>
  </g>
  <path d="M188 201H228M348 201H388M508 201H548M668 201H708" stroke="#7ED6FF" stroke-width="4" stroke-linecap="round"/>
</svg>

