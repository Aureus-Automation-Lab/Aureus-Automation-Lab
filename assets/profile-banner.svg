    <text x="34" y="54" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">operating map</text>
    <text x="34" y="84" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">messy input → reviewed system → useful handoff</text>
    <g transform="translate(34 126)">
      <rect width="102" height="60" rx="15" fill="#0B0E13" stroke="#FF6B6B" stroke-opacity="0.46"/>
      <text x="51" y="36" text-anchor="middle" fill="#FFD7D7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">manual</text>
      <path d="M122 30H166" stroke="#7CC7FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M156 19L169 30L156 41" stroke="#7CC7FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="188" width="118" height="60" rx="15" fill="#0B0E13" stroke="#63E6BE" stroke-opacity="0.58"/>
      <text x="247" y="36" text-anchor="middle" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">workflow</text>
      <path d="M326 30H368" stroke="#7CC7FF" stroke-width="4" stroke-linecap="round"/>
      <path d="M358 19L371 30L358 41" stroke="#7CC7FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="390" width="104" height="60" rx="15" fill="#0B0E13" stroke="#F6C453" stroke-opacity="0.6"/>
      <text x="442" y="36" text-anchor="middle" fill="#FFF0BF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">handoff</text>
    </g>
    <g transform="translate(42 230)">
      <rect width="404" height="30" rx="15" fill="#0B0E13" stroke="#F7F8FA" stroke-opacity="0.12"/>
      <rect width="286" height="30" rx="15" fill="#63E6BE" fill-opacity="0.38">
        <animate attributeName="width" values="260;306;286" dur="6s" repeatCount="indefinite"/>
      </rect>
      <text x="20" y="20" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">scope clarity</text>
      <rect y="50" width="404" height="30" rx="15" fill="#0B0E13" stroke="#F7F8FA" stroke-opacity="0.12"/>
      <rect y="50" width="328" height="30" rx="15" fill="#7CC7FF" fill-opacity="0.34">
        <animate attributeName="width" values="300;342;328" dur="7s" repeatCount="indefinite"/>
      </rect>
      <text x="20" y="70" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">review path</text>
      <rect y="100" width="404" height="30" rx="15" fill="#0B0E13" stroke="#F7F8FA" stroke-opacity="0.12"/>
      <rect y="100" width="248" height="30" rx="15" fill="#F6C453" fill-opacity="0.35">
        <animate attributeName="width" values="224;274;248" dur="8s" repeatCount="indefinite"/>
      </rect>
      <text x="20" y="120" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">first useful slice</text>
    </g>
  </g>
  <circle cx="1156" cy="126" r="33" fill="#63E6BE" fill-opacity="0.12" stroke="#63E6BE" stroke-opacity="0.56" filter="url(#glow)">
    <animate attributeName="r" values="28;36;28" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;1;0.55" dur="5s" repeatCount="indefinite"/>
  </circle>
