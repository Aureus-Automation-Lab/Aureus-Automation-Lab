    <text x="40" y="80" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="60" font-weight="800">Kimi Aoki</text>
    <text x="42" y="126" fill="#AAB5C4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Automation systems · AI-assisted operations · Internal tools</text>
    <text x="42" y="194" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="31" font-weight="800">From manual process to controlled workflow.</text>
    <g transform="translate(42 246)">
      <rect width="158" height="46" rx="23" fill="#63E6BE" fill-opacity="0.14" stroke="#63E6BE" stroke-opacity="0.7"/>
      <text x="79" y="29" text-anchor="middle" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">public-safe</text>
      <rect x="180" width="198" height="46" rx="23" fill="#7CC7FF" fill-opacity="0.13" stroke="#7CC7FF" stroke-opacity="0.58"/>
      <text x="279" y="29" text-anchor="middle" fill="#D9EEFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">reviewable builds</text>
      <rect x="400" width="174" height="46" rx="23" fill="#F6C453" fill-opacity="0.13" stroke="#F6C453" stroke-opacity="0.58"/>
      <text x="487" y="29" text-anchor="middle" fill="#FFF0BF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">owner control</text>
    </g>
  </g>
