<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kimi Aoki operational profile banner</title>
  <desc id="desc">A dark animated operational profile banner for automation systems, AI-assisted operations, and internal tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="0.55" stop-color="#101720"/>
      <stop offset="1" stop-color="#06241F"/>
    </linearGradient>
    <linearGradient id="rail" x1="134" y1="420" x2="1270" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6BE" stop-opacity="0.08"/>
      <stop offset="0.45" stop-color="#63E6BE" stop-opacity="0.85"/>
      <stop offset="0.72" stop-color="#7CC7FF" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#F6C453" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1A2230" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A0D12" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.39 0 0 0 0 0.9 0 0 0 0 0.75 0 0 0 0.45 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <g opacity="0.2">
    <path d="M0 120H1400M0 220H1400M0 320H1400M0 420H1400" stroke="#F7F8FA" stroke-opacity="0.16"/>
    <path d="M150 0V560M300 0V560M450 0V560M600 0V560M750 0V560M900 0V560M1050 0V560M1200 0V560" stroke="#F7F8FA" stroke-opacity="0.1"/>
  </g>
  <path d="M92 448C240 372 374 395 520 318C688 230 828 116 1038 144C1164 160 1255 102 1330 62" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 18">
    <animate attributeName="stroke-dashoffset" values="0;-120" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M90 492C258 418 404 430 578 350C746 273 888 290 1026 338C1168 388 1262 302 1334 226" stroke="#7CC7FF" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
