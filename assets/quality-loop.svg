<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Robert Kolesar / KimiAoki quality loop</title>
  <desc id="desc">A dark quality loop showing scope, tests, review, evidence, handoff, and iteration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="0.54" stop-color="#111820"/>
      <stop offset="1" stop-color="#0B171F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#18212C" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A0D12" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M0 112H1400M0 224H1400M0 336H1400M0 448H1400" stroke="#F7F8FA" stroke-opacity="0.13"/>
    <path d="M175 0V560M350 0V560M525 0V560M700 0V560M875 0V560M1050 0V560M1225 0V560" stroke="#F7F8FA" stroke-opacity="0.08"/>
  </g>
  <text x="74" y="76" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Quality Loop</text>
  <text x="74" y="110" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Robert Kolesár / KimiAoki - Aureus Automation Lab</text>
  <text x="74" y="140" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">A workflow is not finished just because it runs once.</text>
  <g transform="translate(112 178)">
    <rect width="1176" height="270" rx="30" fill="url(#panel)" stroke="#F7F8FA" stroke-opacity="0.14"/>
    <path d="M222 136H968" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M222 136H968" stroke="#63E6BE" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 18">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="11s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(118 70)">
      <circle cx="104" cy="66" r="58" fill="#0F766E" stroke="#63E6BE" stroke-opacity="0.4"/>
      <text x="104" y="61" text-anchor="middle" fill="#F0FDFA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Scope</text>
      <text x="104" y="90" text-anchor="middle" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">clear owner</text>
    </g>
    <g transform="translate(290 70)">
      <circle cx="104" cy="66" r="58" fill="#1D4ED8" stroke="#7CC7FF" stroke-opacity="0.4"/>
      <text x="104" y="61" text-anchor="middle" fill="#EFF6FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Tests</text>
      <text x="104" y="90" text-anchor="middle" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">real examples</text>
    </g>
    <g transform="translate(462 70)">
      <circle cx="104" cy="66" r="58" fill="#6D28D9" stroke="#BDA5FF" stroke-opacity="0.36"/>
      <text x="104" y="61" text-anchor="middle" fill="#F5F3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Review</text>
      <text x="104" y="90" text-anchor="middle" fill="#EDE9FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">human boundary</text>
    </g>
    <g transform="translate(634 70)">
      <circle cx="104" cy="66" r="58" fill="#92400E" stroke="#F6C453" stroke-opacity="0.42"/>
      <text x="104" y="61" text-anchor="middle" fill="#FFFBEB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Evidence</text>
      <text x="104" y="90" text-anchor="middle" fill="#FEF3C7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">proof notes</text>
    </g>
    <g transform="translate(806 70)">
      <circle cx="104" cy="66" r="58" fill="#0F172A" stroke="#63E6BE" stroke-opacity="0.42"/>
      <text x="104" y="61" text-anchor="middle" fill="#E5FFF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Handoff</text>
      <text x="104" y="90" text-anchor="middle" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12">usable later</text>
    </g>
    <g transform="translate(1000 72)">
      <rect width="112" height="112" rx="28" fill="#0B0E13" stroke="#63E6BE" stroke-opacity="0.34"/>
      <path d="M32 58L50 76L82 36" stroke="#63E6BE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
      </path>
      <text x="56" y="148" text-anchor="middle" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">iterate next</text>
    </g>
  </g>
</svg>
