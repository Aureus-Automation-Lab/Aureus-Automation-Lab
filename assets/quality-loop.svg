<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Quality loop board</title>
  <desc id="desc">A visual quality loop showing useful, reviewable, testable, and handoff-ready system states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#EEF4F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0E1116" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <text x="74" y="88" fill="#111318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="850">Quality Loop</text>
  <text x="74" y="126" fill="#596273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">A system is not finished just because it runs once.</text>
  <g transform="translate(150 180)" filter="url(#shadow)">
    <rect width="1100" height="260" rx="32" fill="#FFFFFF" stroke="#D2D8E2"/>
    <path d="M222 130C222 70 270 38 332 38H754C822 38 878 90 878 154C878 218 826 222 780 222H346C274 222 222 190 222 130Z" fill="#0E1116"/>
    <path d="M324 132H772" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <circle cx="324" cy="132" r="58" fill="#0F766E"/>
    <text x="289" y="126" fill="#F0FDFA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="850">Useful</text>
    <text x="278" y="154" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">owner value</text>
    <circle cx="476" cy="132" r="58" fill="#1D4ED8"/>
    <text x="424" y="126" fill="#EFF6FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="850">Reviewable</text>
    <text x="438" y="154" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">clear states</text>
    <circle cx="628" cy="132" r="58" fill="#7C3AED"/>
    <text x="587" y="126" fill="#F5F3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="850">Testable</text>
    <text x="583" y="154" fill="#EDE9FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">real examples</text>
    <circle cx="780" cy="132" r="58" fill="#B45309"/>
    <text x="743" y="126" fill="#FFFBEB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="850">Handoff</text>
    <text x="727" y="154" fill="#FEF3C7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">usable later</text>
    <g transform="translate(42 48)">
      <rect width="128" height="44" rx="22" fill="#63E6BE" fill-opacity="0.16" stroke="#0F766E" stroke-opacity="0.42"/>
      <text x="22" y="28" fill="#0F3D35" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="850">scope first</text>
      <rect y="68" width="154" height="44" rx="22" fill="#7CC7FF" fill-opacity="0.16" stroke="#1D4ED8" stroke-opacity="0.28"/>
      <text x="22" y="96" fill="#123F77" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="850">owner review</text>
      <rect y="136" width="116" height="44" rx="22" fill="#F6C453" fill-opacity="0.22" stroke="#B45309" stroke-opacity="0.3"/>
      <text x="22" y="164" fill="#73420B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="850">evidence</text>
    </g>
    <g transform="translate(934 54)">
      <rect width="120" height="120" rx="28" fill="#0E1116"/>
      <path d="M36 62L54 80L88 40" stroke="#63E6BE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="26" y="156" fill="#596273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="850">ready to improve</text>
    </g>
  </g>
</svg>
