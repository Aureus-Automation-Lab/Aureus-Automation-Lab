<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dark quality loop board</title>
  <desc id="desc">A dark quality loop showing useful, reviewable, testable, and handoff-ready states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="0.54" stop-color="#111820"/>
      <stop offset="1" stop-color="#0B171F"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#18212C" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A0D12" stop-opacity="0.98"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M0 112H1400M0 224H1400M0 336H1400M0 448H1400" stroke="#F7F8FA" stroke-opacity="0.13"/>
    <path d="M175 0V560M350 0V560M525 0V560M700 0V560M875 0V560M1050 0V560M1225 0V560" stroke="#F7F8FA" stroke-opacity="0.08"/>
  </g>
  <text x="74" y="88" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">Quality Loop</text>
  <text x="74" y="126" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">A system is not finished just because it runs once.</text>
  <g transform="translate(112 174)">
    <rect width="1176" height="270" rx="30" fill="url(#panel)" stroke="#F7F8FA" stroke-opacity="0.14"/>
    <path d="M330 136H922" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <path d="M330 136H922" stroke="#63E6BE" stroke-opacity="0.45" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 18">
      <animate attributeName="stroke-dashoffset" values="0;-160" dur="11s" repeatCount="indefinite"/>
    </path>
    <circle cx="330" cy="136" r="64" fill="#0F766E" stroke="#63E6BE" stroke-opacity="0.4"/>
    <text x="330" y="130" text-anchor="middle" fill="#F0FDFA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Useful</text>
    <text x="330" y="160" text-anchor="middle" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">owner value</text>
    <circle cx="528" cy="136" r="64" fill="#1D4ED8" stroke="#7CC7FF" stroke-opacity="0.4"/>
    <text x="528" y="130" text-anchor="middle" fill="#EFF6FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Reviewable</text>
    <text x="528" y="160" text-anchor="middle" fill="#DBEAFE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">clear states</text>
    <circle cx="724" cy="136" r="64" fill="#7C3AED" stroke="#BDA5FF" stroke-opacity="0.36"/>
    <text x="724" y="130" text-anchor="middle" fill="#F5F3FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Testable</text>
    <text x="724" y="160" text-anchor="middle" fill="#EDE9FE" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">real examples</text>
    <circle cx="922" cy="136" r="64" fill="#B45309" stroke="#F6C453" stroke-opacity="0.42"/>
    <text x="922" y="130" text-anchor="middle" fill="#FFFBEB" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">Handoff</text>
    <text x="922" y="160" text-anchor="middle" fill="#FEF3C7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">usable later</text>
    <g transform="translate(40 56)">
      <rect width="150" height="40" rx="20" fill="#63E6BE" fill-opacity="0.13" stroke="#63E6BE" stroke-opacity="0.5"/>
      <text x="75" y="25" text-anchor="middle" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">scope first</text>
      <rect y="60" width="170" height="40" rx="20" fill="#7CC7FF" fill-opacity="0.13" stroke="#7CC7FF" stroke-opacity="0.5"/>
      <text x="85" y="85" text-anchor="middle" fill="#D9EEFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">owner review</text>
      <rect y="120" width="136" height="40" rx="20" fill="#F6C453" fill-opacity="0.15" stroke="#F6C453" stroke-opacity="0.52"/>
      <text x="68" y="145" text-anchor="middle" fill="#FFF0BF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">evidence</text>
    </g>
    <g transform="translate(1042 68)">
      <rect width="112" height="112" rx="28" fill="#0B0E13" stroke="#63E6BE" stroke-opacity="0.34"/>
      <path d="M32 58L50 76L82 36" stroke="#63E6BE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
      </path>
      <text x="56" y="148" text-anchor="middle" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">ready to improve</text>
    </g>
  </g>
</svg>
