<svg width="1400" height="760" viewBox="0 0 1400 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Capability system board</title>
  <desc id="desc">A premium public-safe board showing capabilities across automation, AI operations, internal tools, product prototypes, and delivery quality.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1400" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F5F0"/>
      <stop offset="1" stop-color="#E9EDF2"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#1B2230"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0E1116" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1400" height="760" rx="34" fill="url(#paper)"/>
  <text x="72" y="86" fill="#111318" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="850">Capability System</text>
  <text x="72" y="126" fill="#596273" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">From scattered work to controlled build slices with review, evidence, and handoff.</text>
  <g transform="translate(72 174)" filter="url(#shadow)">
    <rect width="1256" height="510" rx="28" fill="#FFFFFF" stroke="#D2D8E2"/>
    <g transform="translate(44 48)">
      <rect width="246" height="184" rx="22" fill="#0E1116"/>
      <text x="24" y="46" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Automation</text>
      <text x="24" y="82" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">intake, routing, approvals</text>
      <circle cx="38" cy="124" r="10" fill="#63E6BE"/>
      <path d="M54 124H154" stroke="#63E6BE" stroke-width="5" stroke-linecap="round"/>
      <circle cx="174" cy="124" r="10" fill="#7CC7FF"/>
      <path d="M190 124H216" stroke="#7CC7FF" stroke-width="5" stroke-linecap="round"/>
      <text x="24" y="160" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">manual → mapped</text>
    </g>
    <g transform="translate(334 48)">
      <rect width="246" height="184" rx="22" fill="#111827"/>
      <text x="24" y="46" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">AI Ops</text>
      <text x="24" y="82" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">assistants, queues, review</text>
      <rect x="24" y="108" width="198" height="18" rx="9" fill="#7CC7FF" fill-opacity="0.2"/>
      <rect x="24" y="108" width="142" height="18" rx="9" fill="#7CC7FF" fill-opacity="0.7"/>
      <rect x="24" y="140" width="198" height="18" rx="9" fill="#63E6BE" fill-opacity="0.18"/>
      <rect x="24" y="140" width="118" height="18" rx="9" fill="#63E6BE" fill-opacity="0.72"/>
    </g>
    <g transform="translate(624 48)">
      <rect width="246" height="184" rx="22" fill="#151A22"/>
      <text x="24" y="46" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Internal Tools</text>
      <text x="24" y="82" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">dashboards, panels, consoles</text>
      <rect x="24" y="108" width="84" height="56" rx="12" fill="#63E6BE" fill-opacity="0.17" stroke="#63E6BE" stroke-opacity="0.45"/>
      <rect x="124" y="108" width="98" height="24" rx="12" fill="#7CC7FF" fill-opacity="0.18"/>
      <rect x="124" y="140" width="74" height="24" rx="12" fill="#F6C453" fill-opacity="0.2"/>
    </g>
    <g transform="translate(914 48)">
      <rect width="246" height="184" rx="22" fill="#0E1116"/>
      <text x="24" y="46" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">Prototypes</text>
      <text x="24" y="82" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">demos, product slices, offers</text>
      <path d="M32 144C72 102 108 180 150 136C180 105 204 118 222 94" stroke="#F6C453" stroke-width="5" stroke-linecap="round"/>
      <circle cx="32" cy="144" r="7" fill="#F6C453"/>
      <circle cx="222" cy="94" r="7" fill="#63E6BE"/>
    </g>
    <g transform="translate(44 286)">
      <rect width="1116" height="154" rx="22" fill="url(#dark)"/>
      <text x="28" y="44" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="850">Delivery layer</text>
      <text x="28" y="76" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Scope, quality checks, privacy boundary, operating notes, next-build roadmap.</text>
      <g transform="translate(30 104)">
        <rect width="122" height="30" rx="15" fill="#63E6BE" fill-opacity="0.16" stroke="#63E6BE" stroke-opacity="0.52"/>
        <text x="18" y="20" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="850">useful</text>
        <rect x="140" width="146" height="30" rx="15" fill="#7CC7FF" fill-opacity="0.16" stroke="#7CC7FF" stroke-opacity="0.52"/>
        <text x="158" y="20" fill="#D9EEFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="850">reviewable</text>
        <rect x="304" width="126" height="30" rx="15" fill="#F6C453" fill-opacity="0.16" stroke="#F6C453" stroke-opacity="0.52"/>
        <text x="322" y="20" fill="#FFF0BF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="850">testable</text>
        <rect x="448" width="138" height="30" rx="15" fill="#B8F7D4" fill-opacity="0.12" stroke="#B8F7D4" stroke-opacity="0.48"/>
        <text x="466" y="20" fill="#E5FFF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="850">handoff-ready</text>
      </g>
    </g>
  </g>
</svg>
