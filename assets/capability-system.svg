<svg width="1400" height="720" viewBox="0 0 1400 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Róbert Kolesár / robertkolesar capability system board</title>
  <desc id="desc">A dark capability board showing business process, AI workflow, internal tool, validation, evidence, and handoff layers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="0.52" stop-color="#111820"/>
      <stop offset="1" stop-color="#071D1A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#18212C" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A0D12" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#63E6BE" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1400" height="720" rx="34" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M0 120H1400M0 240H1400M0 360H1400M0 480H1400M0 600H1400" stroke="#F7F8FA" stroke-opacity="0.14"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720M1280 0V720" stroke="#F7F8FA" stroke-opacity="0.08"/>
  </g>
  <text x="72" y="78" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Capability System</text>
  <text x="72" y="112" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Róbert Kolesár / robertkolesar - Aureus Automation Lab</text>
  <text x="72" y="142" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Business process, AI workflow, internal tool, validation, evidence, and handoff.</text>
  <g transform="translate(72 172)" filter="url(#glow)">
    <rect width="1256" height="470" rx="30" fill="#101720" fill-opacity="0.84" stroke="#F7F8FA" stroke-opacity="0.14"/>
    <g transform="translate(42 46)">
      <rect width="256" height="174" rx="22" fill="url(#panel)" stroke="#63E6BE" stroke-opacity="0.28"/>
      <text x="26" y="46" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">Business Process</text>
      <text x="26" y="82" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">owners, decisions, pain</text>
      <circle cx="42" cy="126" r="10" fill="#63E6BE"/>
      <path d="M60 126H166" stroke="#63E6BE" stroke-width="5" stroke-linecap="round" stroke-dasharray="90 20">
        <animate attributeName="stroke-dashoffset" values="0;-110" dur="7s" repeatCount="indefinite"/>
      </path>
      <circle cx="188" cy="126" r="10" fill="#7CC7FF"/>
      <path d="M206 126H228" stroke="#7CC7FF" stroke-width="5" stroke-linecap="round"/>
      <text x="26" y="158" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">manual to mapped</text>
    </g>
    <g transform="translate(332 46)">
      <rect width="256" height="174" rx="22" fill="url(#panel)" stroke="#7CC7FF" stroke-opacity="0.28"/>
      <text x="26" y="46" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">AI Workflow</text>
      <text x="26" y="82" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">assist, route, escalate</text>
      <rect x="26" y="108" width="204" height="18" rx="9" fill="#7CC7FF" fill-opacity="0.15"/>
      <rect x="26" y="108" width="144" height="18" rx="9" fill="#7CC7FF" fill-opacity="0.68">
        <animate attributeName="width" values="120;172;144" dur="6s" repeatCount="indefinite"/>
      </rect>
      <rect x="26" y="140" width="204" height="18" rx="9" fill="#63E6BE" fill-opacity="0.14"/>
      <rect x="26" y="140" width="122" height="18" rx="9" fill="#63E6BE" fill-opacity="0.72">
        <animate attributeName="width" values="104;152;122" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g transform="translate(622 46)">
      <rect width="256" height="174" rx="22" fill="url(#panel)" stroke="#F6C453" stroke-opacity="0.28"/>
      <text x="26" y="46" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Internal Tool</text>
      <text x="26" y="82" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">queue, state, action</text>
      <rect x="26" y="108" width="88" height="54" rx="13" fill="#63E6BE" fill-opacity="0.15" stroke="#63E6BE" stroke-opacity="0.46"/>
      <rect x="132" y="108" width="98" height="23" rx="12" fill="#7CC7FF" fill-opacity="0.18"/>
      <rect x="132" y="140" width="76" height="22" rx="11" fill="#F6C453" fill-opacity="0.2"/>
    </g>
    <g transform="translate(912 46)">
      <rect width="256" height="174" rx="22" fill="url(#panel)" stroke="#B8F7D4" stroke-opacity="0.22"/>
      <text x="26" y="46" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">Validation</text>
      <text x="26" y="82" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">tests, review, exceptions</text>
      <path d="M36 138C76 96 112 174 154 130C184 99 208 112 226 88" stroke="#F6C453" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12">
        <animate attributeName="stroke-dashoffset" values="0;-80" dur="8s" repeatCount="indefinite"/>
      </path>
      <circle cx="36" cy="138" r="8" fill="#F6C453"/>
      <circle cx="226" cy="88" r="8" fill="#63E6BE"/>
    </g>
    <g transform="translate(42 274)">
      <rect width="1126" height="132" rx="24" fill="#0B0E13" stroke="#F7F8FA" stroke-opacity="0.12"/>
      <text x="28" y="42" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Evidence and handoff layer</text>
      <text x="28" y="74" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Proof notes, privacy boundary, operating notes, known limits, next-build roadmap.</text>
      <g transform="translate(716 34)">
        <rect width="124" height="34" rx="17" fill="#63E6BE" fill-opacity="0.15" stroke="#63E6BE" stroke-opacity="0.56"/>
        <text x="62" y="22" text-anchor="middle" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">evidence</text>
        <rect x="142" width="148" height="34" rx="17" fill="#7CC7FF" fill-opacity="0.15" stroke="#7CC7FF" stroke-opacity="0.56"/>
        <text x="216" y="22" text-anchor="middle" fill="#D9EEFF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">reviewable</text>
        <rect y="52" width="124" height="34" rx="17" fill="#F6C453" fill-opacity="0.16" stroke="#F6C453" stroke-opacity="0.56"/>
        <text x="62" y="74" text-anchor="middle" fill="#FFF0BF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">testable</text>
        <rect x="142" y="52" width="148" height="34" rx="17" fill="#B8F7D4" fill-opacity="0.12" stroke="#B8F7D4" stroke-opacity="0.5"/>
        <text x="216" y="74" text-anchor="middle" fill="#E5FFF0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">handoff-ready</text>
      </g>
    </g>
  </g>
</svg>
