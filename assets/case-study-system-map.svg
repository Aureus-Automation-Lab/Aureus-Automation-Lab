<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Aureus case study system map</title>
  <desc id="desc">Public-safe case study map showing problem, architecture, system shape, AI role, validation, and proof.</desc>
  <rect width="1280" height="520" rx="36" fill="#08111F"/>
  <path d="M0 390 C240 310 340 120 610 210 C880 300 970 130 1280 92" fill="none" stroke="#5FE7D2" stroke-width="3" opacity="0.24"/>
  <text x="76" y="92" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Case Study Directions</text>
  <text x="76" y="130" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Proof without exposure: architecture shape, validation boundary, and what stays private.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="80" y="192" width="150" height="92" rx="20" fill="#111827" stroke="#9B4D4D"/>
    <text x="112" y="244" fill="#FFD7D7" font-size="21" font-weight="800">Problem</text>
    <rect x="270" y="192" width="170" height="92" rx="20" fill="#111827" stroke="#2C6F69"/>
    <text x="300" y="244" fill="#68F2D8" font-size="21" font-weight="800">Architecture</text>
    <rect x="480" y="192" width="170" height="92" rx="20" fill="#111827" stroke="#315F87"/>
    <text x="514" y="244" fill="#91D8FF" font-size="21" font-weight="800">System shape</text>
    <rect x="690" y="192" width="150" height="92" rx="20" fill="#111827" stroke="#7A5CF5"/>
    <text x="728" y="244" fill="#CDBDFF" font-size="21" font-weight="800">AI role</text>
    <rect x="880" y="192" width="170" height="92" rx="20" fill="#111827" stroke="#8B6C2C"/>
    <text x="912" y="244" fill="#FFE28A" font-size="21" font-weight="800">Validation</text>
    <rect x="1090" y="192" width="150" height="92" rx="20" fill="#111827" stroke="#2C6F69"/>
    <text x="1127" y="244" fill="#68F2D8" font-size="21" font-weight="800">Proof</text>
  </g>
  <path d="M230 238 H270 M440 238 H480 M650 238 H690 M840 238 H880 M1050 238 H1090" stroke="#77C7FF" stroke-width="4" stroke-linecap="round"/>
  <rect x="106" y="348" width="1068" height="72" rx="22" fill="#0F172A" stroke="#243447"/>
  <text x="140" y="392" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700">Public-safe proof: architecture shape, review boundary, evidence, and what stays private.</text>
