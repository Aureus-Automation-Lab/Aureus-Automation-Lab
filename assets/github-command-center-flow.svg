<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Command Center delivery flow</title>
  <desc id="desc">A public-safe GitHub delivery flow from task intake to branch, validation, pull request, owner review, and merge or iteration.</desc>
  <rect width="1280" height="520" rx="32" fill="#071014"/>
  <text x="72" y="72" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">GitHub Command Center Flow</text>
  <text x="72" y="108" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Scoped branch, validation, safety notes, PR review, owner decision.</text>
  <path d="M144 290H1134" stroke="#263746" stroke-width="6" stroke-linecap="round"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800">
    <g transform="translate(70 210)"><rect width="160" height="96" rx="18" fill="#101A27" stroke="#4CE0B5"/><text x="80" y="42" text-anchor="middle" fill="#E5FFF0" font-size="17">task</text><text x="80" y="66" text-anchor="middle" fill="#E5FFF0" font-size="17">intake</text></g>
    <g transform="translate(250 210)"><rect width="160" height="96" rx="18" fill="#101A27" stroke="#71C7FF"/><text x="80" y="42" text-anchor="middle" fill="#E8F6FF" font-size="17">scoped</text><text x="80" y="66" text-anchor="middle" fill="#E8F6FF" font-size="17">branch</text></g>
    <g transform="translate(430 210)"><rect width="160" height="96" rx="18" fill="#101A27" stroke="#A97CFF"/><text x="80" y="42" text-anchor="middle" fill="#F0E6FF" font-size="17">build</text><text x="80" y="66" text-anchor="middle" fill="#F0E6FF" font-size="17">slice</text></g>
    <g transform="translate(610 210)"><rect width="160" height="96" rx="18" fill="#101A27" stroke="#FFC857"/><text x="80" y="42" text-anchor="middle" fill="#FFF4C7" font-size="17">validation</text><text x="80" y="66" text-anchor="middle" fill="#FFF4C7" font-size="17">evidence</text></g>
    <g transform="translate(790 210)"><rect width="160" height="96" rx="18" fill="#101A27" stroke="#5CE1E6"/><text x="80" y="42" text-anchor="middle" fill="#DDFEFF" font-size="17">pull</text><text x="80" y="66" text-anchor="middle" fill="#DDFEFF" font-size="17">request</text></g>
    <g transform="translate(970 210)"><rect width="160" height="96" rx="18" fill="#101A27" stroke="#4CE0B5"/><text x="80" y="42" text-anchor="middle" fill="#E5FFF0" font-size="17">owner</text><text x="80" y="66" text-anchor="middle" fill="#E5FFF0" font-size="17">review</text></g>
  </g>
  <text x="72" y="400" fill="#D9E7F7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">No deploy, repo setting change, external message, n8n activation, or production action without explicit owner approval.</text>
</svg>
