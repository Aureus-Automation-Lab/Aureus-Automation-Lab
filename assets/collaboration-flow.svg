<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Róbert Kolesár / robert-kolesar collaboration flow</title>
  <desc id="desc">A dark collaboration flow from discovery to architecture, build, review, handoff, and next iteration.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B10"/>
      <stop offset="0.58" stop-color="#111820"/>
      <stop offset="1" stop-color="#071D1A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#18212C" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0A0D12" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="flow" x1="140" y1="294" x2="1230" y2="266" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6BE"/>
      <stop offset="0.5" stop-color="#7CC7FF"/>
      <stop offset="1" stop-color="#F6C453"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#63E6BE" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <g opacity="0.17">
    <path d="M0 112H1400M0 224H1400M0 336H1400M0 448H1400" stroke="#F7F8FA" stroke-opacity="0.14"/>
    <path d="M175 0V560M350 0V560M525 0V560M700 0V560M875 0V560M1050 0V560M1225 0V560" stroke="#F7F8FA" stroke-opacity="0.08"/>
  </g>
  <text x="74" y="76" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="800">Collaboration Flow</text>
  <text x="74" y="110" fill="#B8F7D4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="800">Róbert Kolesár / robert-kolesar - Aureus Automation Lab</text>
  <text x="74" y="140" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Discovery, architecture, build, review, handoff, and next iteration.</text>
  <path d="M178 316C326 246 438 236 586 300C726 360 842 254 982 284C1092 306 1142 248 1246 244" stroke="url(#flow)" stroke-width="6" stroke-linecap="round" stroke-dasharray="16 18">
    <animate attributeName="stroke-dashoffset" values="0;-180" dur="12s" repeatCount="indefinite"/>
  </path>
  <g transform="translate(72 204)">
    <g>
      <rect width="224" height="178" rx="24" fill="url(#panel)" stroke="#63E6BE" stroke-opacity="0.32"/>
      <text x="26" y="42" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">01 Discovery</text>
      <text x="26" y="74" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">process, owner, risk</text>
      <rect x="26" y="108" width="156" height="26" rx="13" fill="#63E6BE" fill-opacity="0.18"/>
      <rect x="26" y="144" width="120" height="8" rx="4" fill="#F6C453" fill-opacity="0.46"/>
    </g>
    <g transform="translate(250 0)">
      <rect width="224" height="178" rx="24" fill="url(#panel)" stroke="#7CC7FF" stroke-opacity="0.32"/>
      <text x="26" y="42" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">02 Architecture</text>
      <text x="26" y="74" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">system shape, boundaries</text>
      <rect x="26" y="108" width="72" height="52" rx="14" fill="#63E6BE" fill-opacity="0.14" stroke="#63E6BE" stroke-opacity="0.38"/>
      <rect x="114" y="108" width="84" height="22" rx="11" fill="#7CC7FF" fill-opacity="0.2"/>
      <rect x="114" y="140" width="64" height="20" rx="10" fill="#F6C453" fill-opacity="0.2"/>
    </g>
    <g transform="translate(500 0)" filter="url(#glow)">
      <rect width="224" height="178" rx="24" fill="url(#panel)" stroke="#F6C453" stroke-opacity="0.36"/>
      <text x="26" y="42" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">03 Build</text>
      <text x="26" y="74" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">first useful slice</text>
      <rect x="26" y="110" width="172" height="30" rx="15" fill="#7CC7FF" fill-opacity="0.14"/>
      <rect x="26" y="110" width="110" height="30" rx="15" fill="#7CC7FF" fill-opacity="0.55"/>
      <text x="112" y="158" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">usable early</text>
    </g>
    <g transform="translate(750 0)">
      <rect width="224" height="178" rx="24" fill="url(#panel)" stroke="#63E6BE" stroke-opacity="0.32"/>
      <text x="26" y="42" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">04 Review</text>
      <text x="26" y="74" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">tests, edges, evidence</text>
      <path d="M52 122L82 150L158 90" stroke="#63E6BE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(1000 0)">
      <rect width="224" height="178" rx="24" fill="url(#panel)" stroke="#F6C453" stroke-opacity="0.36"/>
      <text x="26" y="42" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">05 Handoff</text>
      <text x="26" y="74" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">operate, improve, own</text>
      <rect x="26" y="108" width="154" height="26" rx="13" fill="#F6C453" fill-opacity="0.22"/>
      <rect x="26" y="144" width="124" height="8" rx="4" fill="#63E6BE" fill-opacity="0.38"/>
    </g>
  </g>
  <g transform="translate(192 444)">
    <rect width="1016" height="52" rx="26" fill="#0B0E13" stroke="#F7F8FA" stroke-opacity="0.12"/>
    <text x="508" y="33" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Next iteration starts from evidence, not guesswork.</text>
  </g>
</svg>
