<svg width="1400" height="560" viewBox="0 0 1400 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Collaboration flow board</title>
  <desc id="desc">A visual collaboration flow from discovery to design, build, review, and handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1116"/>
      <stop offset="1" stop-color="#151A22"/>
    </linearGradient>
    <linearGradient id="line" x1="112" y1="304" x2="1270" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63E6BE"/>
      <stop offset="0.48" stop-color="#7CC7FF"/>
      <stop offset="1" stop-color="#F6C453"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="560" rx="34" fill="url(#bg)"/>
  <text x="74" y="88" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="40" font-weight="850">Collaboration Flow</text>
  <text x="74" y="126" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">A useful engagement should move from ambiguity to an owned first version.</text>
  <path d="M126 304C264 214 403 390 542 304C679 219 818 218 956 304C1087 385 1198 304 1278 228" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
  <g transform="translate(92 202)">
    <rect width="214" height="188" rx="24" fill="#151A22" stroke="#63E6BE" stroke-opacity="0.44"/>
    <text x="26" y="44" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">01 Discover</text>
    <text x="26" y="78" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">process, owner, pain</text>
    <rect x="26" y="112" width="150" height="22" rx="11" fill="#63E6BE" fill-opacity="0.16"/>
    <rect x="26" y="146" width="114" height="22" rx="11" fill="#7CC7FF" fill-opacity="0.12"/>
  </g>
  <g transform="translate(354 202)">
    <rect width="214" height="188" rx="24" fill="#151A22" stroke="#7CC7FF" stroke-opacity="0.44"/>
    <text x="26" y="44" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">02 Design</text>
    <text x="26" y="78" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">first useful slice</text>
    <path d="M32 140H176" stroke="#7CC7FF" stroke-opacity="0.6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="64" cy="140" r="11" fill="#7CC7FF"/>
    <circle cx="132" cy="140" r="11" fill="#F6C453"/>
  </g>
  <g transform="translate(616 202)">
    <rect width="214" height="188" rx="24" fill="#151A22" stroke="#F6C453" stroke-opacity="0.44"/>
    <text x="26" y="44" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">03 Build</text>
    <text x="26" y="78" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">working version</text>
    <rect x="30" y="114" width="54" height="54" rx="14" fill="#63E6BE" fill-opacity="0.18"/>
    <rect x="98" y="114" width="84" height="22" rx="11" fill="#7CC7FF" fill-opacity="0.16"/>
    <rect x="98" y="148" width="66" height="20" rx="10" fill="#F6C453" fill-opacity="0.2"/>
  </g>
  <g transform="translate(878 202)">
    <rect width="214" height="188" rx="24" fill="#151A22" stroke="#63E6BE" stroke-opacity="0.38"/>
    <text x="26" y="44" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">04 Review</text>
    <text x="26" y="78" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">tests, edges, risk</text>
    <path d="M42 136L74 166L150 108" stroke="#63E6BE" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(1140 202)">
    <rect width="214" height="188" rx="24" fill="#151A22" stroke="#F6C453" stroke-opacity="0.44"/>
    <text x="26" y="44" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="850">05 Handoff</text>
    <text x="26" y="78" fill="#9AA4B2" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">usable without guessing</text>
    <rect x="28" y="112" width="156" height="22" rx="11" fill="#F6C453" fill-opacity="0.2"/>
    <rect x="28" y="146" width="124" height="22" rx="11" fill="#63E6BE" fill-opacity="0.16"/>
  </g>
  <text x="74" y="484" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">The first version should be small enough to validate and clear enough for the owner to operate.</text>
</svg>
