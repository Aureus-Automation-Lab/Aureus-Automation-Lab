<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">Aureus AOP public-safe architecture</title>
  <desc id="desc">A public-safe architecture map showing business process, GitHub delivery, agents, n8n workflow source, validation, egress review, evidence, and handoff.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#071014"/><stop offset="0.55" stop-color="#0D1420"/><stop offset="1" stop-color="#061F1B"/></linearGradient>
    <linearGradient id="panel" x1="0" x2="1"><stop stop-color="#101A27"/><stop offset="1" stop-color="#0B1118"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1280" height="620" rx="34" fill="url(#bg)"/>
  <path d="M80 116H1200M80 246H1200M80 376H1200M80 506H1200" stroke="#1D2A36" stroke-width="1"/>
  <path d="M150 520C310 372 429 386 575 281S851 138 1120 112" fill="none" stroke="#54E5C0" stroke-width="3" opacity=".35"/>
  <text x="70" y="74" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">Aureus Autonomous Operating Platform</text>
  <text x="70" y="111" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Business process -> GitHub delivery -> n8n / agents / Web Studio -> validation -> evidence -> handoff</text>
  <g filter="url(#shadow)">
    <rect x="70" y="165" width="1140" height="330" rx="28" fill="url(#panel)" stroke="#2A3748"/>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="16">
      <rect x="105" y="226" width="160" height="80" rx="18" fill="#11231F" stroke="#4CE0B5"/><text x="185" y="260" text-anchor="middle" fill="#D9FFF1">business</text><text x="185" y="282" text-anchor="middle" fill="#D9FFF1">process</text>
      <rect x="305" y="226" width="160" height="80" rx="18" fill="#111B2A" stroke="#71C7FF"/><text x="385" y="260" text-anchor="middle" fill="#E2F4FF">GitHub</text><text x="385" y="282" text-anchor="middle" fill="#E2F4FF">Command</text>
      <rect x="505" y="226" width="160" height="80" rx="18" fill="#151424" stroke="#A97CFF"/><text x="585" y="260" text-anchor="middle" fill="#F0E6FF">agent /</text><text x="585" y="282" text-anchor="middle" fill="#F0E6FF">Codex work</text>
      <rect x="705" y="226" width="160" height="80" rx="18" fill="#241B0F" stroke="#FFC857"/><text x="785" y="260" text-anchor="middle" fill="#FFF4C7">n8n workflow</text><text x="785" y="282" text-anchor="middle" fill="#FFF4C7">source</text>
      <rect x="905" y="226" width="160" height="80" rx="18" fill="#171F24" stroke="#5CE1E6"/><text x="985" y="260" text-anchor="middle" fill="#DDFEFF">validation</text><text x="985" y="282" text-anchor="middle" fill="#DDFEFF">gates</text>
    </g>
    <path d="M265 266H305M465 266H505M665 266H705M865 266H905" stroke="#7ED6FF" stroke-width="5" stroke-linecap="round"/>
    <path d="M1050 308C1015 380 940 414 818 414H306C212 414 150 390 125 334" fill="none" stroke="#4CE0B5" stroke-width="3" opacity=".65"/>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="15">
      <rect x="245" y="375" width="170" height="54" rx="15" fill="#0C151D" stroke="#39506A"/><text x="330" y="408" text-anchor="middle" fill="#D9E7F7">egress review</text>
      <rect x="455" y="375" width="170" height="54" rx="15" fill="#0C151D" stroke="#39506A"/><text x="540" y="408" text-anchor="middle" fill="#D9E7F7">evidence ledger</text>
      <rect x="665" y="375" width="170" height="54" rx="15" fill="#0C151D" stroke="#39506A"/><text x="750" y="408" text-anchor="middle" fill="#D9E7F7">owner handoff</text>
    </g>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800">
    <rect x="70" y="535" width="176" height="34" rx="17" fill="#11231F" stroke="#4CE0B5"/><text x="158" y="557" text-anchor="middle" fill="#B8F7D4">public-safe</text>
    <rect x="266" y="535" width="176" height="34" rx="17" fill="#111B2A" stroke="#71C7FF"/><text x="354" y="557" text-anchor="middle" fill="#D9EEFF">reviewable</text>
    <rect x="462" y="535" width="176" height="34" rx="17" fill="#241B0F" stroke="#FFC857"/><text x="550" y="557" text-anchor="middle" fill="#FFF0BF">owner-controlled</text>
  </g>
</svg>
