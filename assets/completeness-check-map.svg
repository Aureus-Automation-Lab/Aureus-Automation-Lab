<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Aureus profile completeness map</title>
  <desc id="desc">Checklist map for public profile completeness, safety, visuals, and maintenance.</desc>
  <rect width="1280" height="520" rx="36" fill="#08111F"/>
  <text x="76" y="92" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Completeness Check</text>
  <text x="76" y="130" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">A public GitHub profile is ready only when identity, proof, safety, visuals, and pins agree.</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <circle cx="150" cy="258" r="58" fill="#12372F" stroke="#5FE7D2"/>
    <text x="123" y="266" fill="#D9FFF5" font-size="22" font-weight="900">ID</text>
    <circle cx="360" cy="258" r="58" fill="#122B44" stroke="#77C7FF"/>
    <text x="326" y="266" fill="#D8EEFF" font-size="22" font-weight="900">VIS</text>
    <circle cx="570" cy="258" r="58" fill="#322913" stroke="#F7D77A"/>
    <text x="536" y="266" fill="#FFF2B8" font-size="22" font-weight="900">SAFE</text>
    <circle cx="780" cy="258" r="58" fill="#17162F" stroke="#A88BFF"/>
    <text x="742" y="266" fill="#E2D8FF" font-size="22" font-weight="900">PROOF</text>
    <circle cx="990" cy="258" r="58" fill="#12372F" stroke="#5FE7D2"/>
    <text x="953" y="266" fill="#D9FFF5" font-size="22" font-weight="900">PINS</text>
    <circle cx="1160" cy="258" r="58" fill="#122B44" stroke="#77C7FF"/>
    <text x="1120" y="266" fill="#D8EEFF" font-size="22" font-weight="900">SEND</text>
  </g>
  <path d="M208 258 H302 M418 258 H512 M628 258 H722 M838 258 H932 M1048 258 H1102" stroke="#77C7FF" stroke-width="4" stroke-linecap="round" opacity="0.65"/>
  <rect x="96" y="378" width="1088" height="58" rx="18" fill="#0F172A" stroke="#243447"/>
  <text x="132" y="414" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">The profile should be scannable in 60 seconds, safe to send, and easy to maintain after public launch.</text>
</svg>
