<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640" role="img" aria-labelledby="title desc">
  <title id="title">Aureus controlled AI automation operating flow</title>
  <desc id="desc">A dark premium product-style diagram showing how business signals move through mission queue, AI workflow, human review, evidence, and business output.</desc>
  <defs>
    <radialGradient id="glowA" cx="22%" cy="20%" r="55%">
      <stop offset="0" stop-color="#234C5B" stop-opacity="0.72"/>
      <stop offset="0.45" stop-color="#101B25" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#070B10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="86%" cy="18%" r="54%">
      <stop offset="0" stop-color="#6C4A18" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1A1410" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#070B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="0.48" stop-color="#0A0F15"/>
      <stop offset="1" stop-color="#12130F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#C89132"/>
      <stop offset="0.45" stop-color="#F1D98A"/>
      <stop offset="1" stop-color="#A86F1D"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#4AD6FF"/>
      <stop offset="1" stop-color="#7BE7C7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.95 0 1 0 0 0.78 0 0 1 0 0.38 0 0 0 0.7 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label{font-family:Segoe UI,Arial,sans-serif;font-size:14px;letter-spacing:.12em;text-transform:uppercase;fill:#8FA0AF}
      .title{font-family:Segoe UI,Arial,sans-serif;font-size:34px;font-weight:750;fill:#F5F7FA}
      .subtitle{font-family:Segoe UI,Arial,sans-serif;font-size:18px;fill:#B8C3CF}
      .small{font-family:Segoe UI,Arial,sans-serif;font-size:15px;fill:#8997A6}
      .tiny{font-family:Segoe UI,Arial,sans-serif;font-size:12px;letter-spacing:.06em;text-transform:uppercase;fill:#6F7E8C}
      .panel{fill:#0E151D;stroke:#243241;stroke-width:1.15}
      .panelGold{fill:#10171C;stroke:url(#gold);stroke-width:1.4}
      .line{fill:none;stroke:#314151;stroke-width:2.2}
      .lineGold{fill:none;stroke:url(#gold);stroke-width:3}
      .lineCyan{fill:none;stroke:url(#cyan);stroke-width:2.2;opacity:.72}
      @keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
      @keyframes breathe{0%,100%{opacity:.44}50%{opacity:.95}}
      @keyframes shimmer{0%{transform:translateX(-170px)}100%{transform:translateX(520px)}}
      @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
      .packet1{offset-path:path("M190 420 C315 322 430 317 556 374 C681 430 766 431 890 364 C1016 296 1125 298 1232 228");animation:travel 6.3s linear infinite}
      .packet2{offset-path:path("M190 420 C315 322 430 317 556 374 C681 430 766 431 890 364 C1016 296 1125 298 1232 228");animation:travel 6.3s linear infinite 2.1s}
      .packet3{offset-path:path("M190 420 C315 322 430 317 556 374 C681 430 766 431 890 364 C1016 296 1125 298 1232 228");animation:travel 6.3s linear infinite 4.2s}
      .breathe{animation:breathe 4.4s ease-in-out infinite}
      .blink{animation:blink 2.6s ease-in-out infinite}
      .shimmer{animation:shimmer 5.8s linear infinite}
    </style>
  </defs>

  <rect width="1400" height="640" rx="36" fill="url(#bg)"/>
  <rect width="1400" height="640" rx="36" fill="url(#glowA)"/>
  <rect width="1400" height="640" rx="36" fill="url(#glowB)"/>

  <g opacity=".18">
    <path d="M0 122H1400M0 240H1400M0 358H1400M0 476H1400" stroke="#73808D" stroke-width="1"/>
    <path d="M150 0V640M330 0V640M510 0V640M690 0V640M870 0V640M1050 0V640M1230 0V640" stroke="#73808D" stroke-width="1"/>
  </g>

  <g transform="translate(70 64)">
    <text x="0" y="0" class="label">Aureus Automation Lab</text>
    <text x="0" y="42" class="title">Controlled AI Automation System</text>
    <text x="0" y="78" class="subtitle">Business work moves through scope, AI assistance, review, evidence, and handoff.</text>
  </g>

  <g transform="translate(1010 58)">
    <rect class="panel" x="0" y="0" width="316" height="72" rx="18"/>
    <circle cx="34" cy="36" r="10" fill="#76E4C6" class="blink"/>
    <text x="58" y="31" class="small" fill="#D9E3EC">AI prepares. People approve.</text>
    <text x="58" y="53" class="tiny">Evidence remains</text>
  </g>

  <path class="line" d="M190 420 C315 322 430 317 556 374 C681 430 766 431 890 364 C1016 296 1125 298 1232 228"/>
  <path class="lineGold" opacity=".78" d="M190 420 C315 322 430 317 556 374 C681 430 766 431 890 364 C1016 296 1125 298 1232 228"/>
  <path class="lineCyan breathe" d="M142 506 C302 530 435 501 564 454 C693 407 812 406 944 458 C1062 505 1192 503 1302 462"/>

  <g filter="url(#shadow)">
    <g transform="translate(72 302)">
      <rect class="panel" width="212" height="138" rx="22"/>
      <text x="26" y="36" class="label">Signal</text>
      <text x="26" y="73" class="subtitle" fill="#F5F7FA">Business work</text>
      <text x="26" y="101" class="small">request, invoice, lead, task</text>
      <rect x="26" y="116" width="88" height="5" rx="2.5" fill="url(#cyan)"/>
    </g>

    <g transform="translate(318 202)">
      <rect class="panel" width="212" height="138" rx="22"/>
      <text x="26" y="36" class="label">Mission</text>
      <text x="26" y="73" class="subtitle" fill="#F5F7FA">Scope and owner</text>
      <text x="26" y="101" class="small">what should happen next</text>
      <path d="M26 118H166" stroke="#344658" stroke-width="5" stroke-linecap="round"/>
      <path d="M26 118H102" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
    </g>

    <g transform="translate(564 302)">
      <rect class="panelGold" width="236" height="154" rx="24"/>
      <text x="28" y="38" class="label">AI workflow</text>
      <text x="28" y="76" class="subtitle" fill="#F5F7FA">Prepare, classify, draft</text>
      <text x="28" y="104" class="small">automation works inside limits</text>
      <rect x="28" y="122" width="176" height="12" rx="6" fill="#25323F"/>
      <rect class="shimmer" x="28" y="122" width="95" height="12" rx="6" fill="url(#gold)" opacity=".72"/>
    </g>

    <g transform="translate(838 208)">
      <rect class="panel" width="212" height="138" rx="22"/>
      <text x="26" y="36" class="label">Review</text>
      <text x="26" y="73" class="subtitle" fill="#F5F7FA">Human approval</text>
      <text x="26" y="101" class="small">important actions pause here</text>
      <path d="M37 121l20 20 51-60" transform="translate(76 -34)" stroke="url(#gold)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(1036 326)">
      <rect class="panel" width="212" height="138" rx="22"/>
      <text x="26" y="36" class="label">Evidence</text>
      <text x="26" y="73" class="subtitle" fill="#F5F7FA">Proof notes</text>
      <text x="26" y="101" class="small">what changed and why</text>
      <rect x="26" y="116" width="148" height="6" rx="3" fill="#344658"/>
      <rect x="26" y="129" width="112" height="6" rx="3" fill="#344658"/>
    </g>

    <g transform="translate(1118 126)">
      <rect class="panelGold" width="212" height="142" rx="24"/>
      <text x="26" y="38" class="label">Output</text>
      <text x="26" y="76" class="subtitle" fill="#F5F7FA">Clear next step</text>
      <text x="26" y="104" class="small">handoff, report, proposal</text>
      <circle cx="162" cy="46" r="18" stroke="url(#gold)" stroke-width="4" fill="none"/>
    </g>
  </g>

  <circle class="packet1" r="8" fill="#F3D47D" filter="url(#softGlow)"/>
  <circle class="packet2" r="6" fill="#58DAFF" filter="url(#softGlow)"/>
  <circle class="packet3" r="5" fill="#FFFFFF" filter="url(#softGlow)"/>

  <g transform="translate(78 508)">
    <rect class="panel" width="374" height="78" rx="20"/>
    <text x="24" y="32" class="label">Review boundary</text>
    <text x="24" y="56" class="small">AI may prepare work; approval stays visible.</text>
  </g>
  <g transform="translate(498 508)">
    <rect class="panel" width="374" height="78" rx="20"/>
    <text x="24" y="32" class="label">Evidence ledger</text>
    <text x="24" y="56" class="small">The system records what happened and what was reviewed.</text>
  </g>
  <g transform="translate(918 508)">
    <rect class="panel" width="374" height="78" rx="20"/>
    <text x="24" y="32" class="label">Business output</text>
    <text x="24" y="56" class="small">The team gets a clear next step, not another loose task.</text>
  </g>
</svg>
