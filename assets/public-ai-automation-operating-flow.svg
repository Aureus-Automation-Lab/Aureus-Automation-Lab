<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Controlled AI Automation System</title>
  <desc id="desc">A premium dark architecture diagram showing Business Signal, Mission Queue, AI Workflow Layer, Human Review, Evidence Ledger, and Business Output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071019"/>
      <stop offset="0.48" stop-color="#0B1118"/>
      <stop offset="1" stop-color="#121617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#E8C36A"/>
      <stop offset="0.52" stop-color="#F6E3A2"/>
      <stop offset="1" stop-color="#B98933"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#4DE3FF"/>
      <stop offset="1" stop-color="#7C8CFF"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.86 0 1 0 0 0.66 0 0 1 0 0.28 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:15px;letter-spacing:.08em;text-transform:uppercase;fill:#AAB7C4}
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:23px;font-weight:700;fill:#F7FAFC}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:14px;fill:#8B98A7}
      .node{fill:#101821;stroke:#283544;stroke-width:1.2}
      .nodeHot{fill:#121A20;stroke:url(#gold);stroke-width:1.5}
      .rail{stroke:#334151;stroke-width:2.2;fill:none}
      .railGold{stroke:url(#gold);stroke-width:2.8;fill:none}
      .railCyan{stroke:url(#cyan);stroke-width:2.4;fill:none;opacity:.75}
      .pulse{filter:url(#softGlow)}
      @keyframes travel{0%{offset-distance:0%;opacity:0}8%{opacity:1}92%{opacity:1}100%{offset-distance:100%;opacity:0}}
      @keyframes breathe{0%,100%{opacity:.48}50%{opacity:.95}}
      @keyframes blink{0%,100%{opacity:.28}50%{opacity:1}}
      .dot1{offset-path:path("M 106 302 C 230 246, 303 246, 384 286 C 462 326, 545 327, 623 285 C 711 238, 789 241, 865 286 C 943 332, 1017 323, 1162 258");animation:travel 5.8s linear infinite}
      .dot2{offset-path:path("M 106 302 C 230 246, 303 246, 384 286 C 462 326, 545 327, 623 285 C 711 238, 789 241, 865 286 C 943 332, 1017 323, 1162 258");animation:travel 5.8s linear infinite 1.9s}
      .dot3{offset-path:path("M 106 302 C 230 246, 303 246, 384 286 C 462 326, 545 327, 623 285 C 711 238, 789 241, 865 286 C 943 332, 1017 323, 1162 258");animation:travel 5.8s linear infinite 3.7s}
      .breathe{animation:breathe 4s ease-in-out infinite}
      .blink{animation:blink 2.8s ease-in-out infinite}
    </style>
  </defs>

  <rect width="1280" height="520" rx="34" fill="url(#bg)"/>
  <path d="M60 410 C210 355, 315 365, 452 407 C590 450, 728 449, 864 397 C1008 342, 1102 342, 1220 388" stroke="#1C2733" stroke-width="1.2" fill="none"/>
  <path d="M50 112 H1230" stroke="#19222E" stroke-width="1"/>
  <path d="M50 458 H1230" stroke="#19222E" stroke-width="1"/>

  <text x="62" y="70" class="label">Aureus Automation Lab</text>
  <text x="62" y="99" class="title">Controlled AI Automation System</text>
  <text x="885" y="70" class="small">AI prepares · people approve · evidence remains</text>

  <path class="rail" d="M 106 302 C 230 246, 303 246, 384 286 C 462 326, 545 327, 623 285 C 711 238, 789 241, 865 286 C 943 332, 1017 323, 1162 258"/>
  <path class="railGold" d="M 106 302 C 230 246, 303 246, 384 286 C 462 326, 545 327, 623 285 C 711 238, 789 241, 865 286 C 943 332, 1017 323, 1162 258" opacity=".62"/>
  <path class="railCyan breathe" d="M 154 354 C 283 394, 404 383, 519 346 C 640 307, 763 306, 884 349 C 1004 392, 1101 379, 1192 334"/>

  <g transform="translate(64 184)">
    <rect class="node" width="166" height="112" rx="18"/>
    <circle cx="28" cy="28" r="7" fill="#4DE3FF" class="blink"/>
    <text x="22" y="65" class="title" font-size="20">Business Signal</text>
    <text x="22" y="88" class="small">manual work appears</text>
  </g>

  <g transform="translate(264 132)">
    <rect class="node" width="166" height="112" rx="18"/>
    <path d="M26 32 h42 m-42 18 h78 m-78 18 h55" stroke="#E8C36A" stroke-width="5" stroke-linecap="round"/>
    <text x="22" y="82" class="title" font-size="20">Mission Queue</text>
    <text x="22" y="104" class="small">scope and owner</text>
  </g>

  <g transform="translate(464 188)">
    <rect class="nodeHot" width="176" height="122" rx="20"/>
    <path d="M34 42 h108 M34 64 h86 M34 86 h116" stroke="#F6E3A2" stroke-width="4" stroke-linecap="round"/>
    <text x="22" y="31" class="label">AI Workflow Layer</text>
    <text x="22" y="110" class="small">draft · classify · check</text>
  </g>

  <g transform="translate(684 132)">
    <rect class="node" width="166" height="112" rx="18"/>
    <path d="M45 63 l22 22 l54 -62" stroke="#E8C36A" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="22" y="31" class="label">Human Review</text>
    <text x="22" y="102" class="small">approval boundary</text>
  </g>

  <g transform="translate(884 196)">
    <rect class="node" width="166" height="112" rx="18"/>
    <rect x="28" y="30" width="110" height="13" rx="6" fill="#2F3C49"/>
    <rect x="28" y="56" width="86" height="13" rx="6" fill="#2F3C49"/>
    <rect x="28" y="82" width="119" height="13" rx="6" fill="#2F3C49"/>
    <text x="22" y="132" class="label" fill="#E8C36A">Evidence Ledger</text>
  </g>

  <g transform="translate(1084 126)">
    <rect class="nodeHot" width="166" height="132" rx="20"/>
    <circle cx="52" cy="54" r="22" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <path d="M88 46 h45 M88 66 h35 M88 86 h54" stroke="#C8D4DF" stroke-width="5" stroke-linecap="round"/>
    <text x="22" y="113" class="title" font-size="20">Business Output</text>
    <text x="22" y="136" class="small">next step is clear</text>
  </g>

  <circle class="pulse dot1" r="7" fill="#F6E3A2"/>
  <circle class="pulse dot2" r="5.5" fill="#4DE3FF"/>
  <circle class="pulse dot3" r="4.5" fill="#FFFFFF"/>

  <g opacity=".9">
    <rect x="64" y="344" width="288" height="58" rx="16" fill="#0C141D" stroke="#23303E"/>
    <text x="84" y="369" class="label">Review Boundary</text>
    <text x="84" y="390" class="small">important actions do not run silently</text>
  </g>
  <g opacity=".9">
    <rect x="840" y="356" width="350" height="58" rx="16" fill="#0C141D" stroke="#23303E"/>
    <text x="862" y="381" class="label">Proof Pack Thinking</text>
    <text x="862" y="402" class="small">what happened, who reviewed, what changed</text>
  </g>
</svg>
