<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Aureus operating loop</title>
  <desc id="desc">A public-safe operating loop from business process to workflow, AI assist, review, validation, evidence, handoff, and learning.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/>
      <stop offset="1" stop-color="#eef6f6"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6c777"/>
      <stop offset="1" stop-color="#a77a28"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="360" rx="28" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="48" y="56" fill="#13232c" font-size="26" font-weight="800">Aureus Operating Loop</text>
    <text x="48" y="88" fill="#54666d" font-size="16">The work becomes useful when it can be seen, reviewed, validated, and handed off.</text>
  </g>
  <g transform="translate(54 132)" font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="0" y="0" width="120" height="92" rx="18" fill="#13232c"/>
      <text x="24" y="38" fill="#ffffff" font-size="16" font-weight="700">Process</text>
      <text x="24" y="64" fill="#b7c7cb" font-size="12">real work</text>
    </g>
    <path d="M128 46 H172" stroke="url(#gold)" stroke-width="4"/>
    <g transform="translate(180 0)">
      <rect width="120" height="92" rx="18" fill="#ffffff" stroke="#d9dfdd"/>
      <text x="22" y="38" fill="#13232c" font-size="16" font-weight="700">Workflow</text>
      <text x="22" y="64" fill="#63737a" font-size="12">mapped path</text>
    </g>
    <path d="M308 46 H352" stroke="url(#gold)" stroke-width="4"/>
    <g transform="translate(360 0)">
      <rect width="120" height="92" rx="18" fill="#ffffff" stroke="#d9dfdd"/>
      <text x="28" y="38" fill="#13232c" font-size="16" font-weight="700">AI Assist</text>
      <text x="24" y="64" fill="#63737a" font-size="12">draft/extract</text>
    </g>
    <path d="M488 46 H532" stroke="url(#gold)" stroke-width="4"/>
    <g transform="translate(540 0)">
      <rect width="120" height="92" rx="18" fill="#ffffff" stroke="#d9dfdd"/>
      <text x="24" y="38" fill="#13232c" font-size="16" font-weight="700">Review</text>
      <text x="24" y="64" fill="#63737a" font-size="12">human gate</text>
    </g>
    <path d="M668 46 H712" stroke="url(#gold)" stroke-width="4"/>
    <g transform="translate(720 0)">
      <rect width="120" height="92" rx="18" fill="#13232c"/>
      <text x="22" y="38" fill="#ffffff" font-size="16" font-weight="700">Evidence</text>
      <text x="22" y="64" fill="#b7c7cb" font-size="12">proof + handoff</text>
    </g>
  </g>
  <path d="M894 178 C950 178 950 278 500 278 C210 278 102 244 102 224" fill="none" stroke="#6eb8c7" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 10"/>
  <text x="420" y="310" fill="#54666d" font-family="Inter, Arial, sans-serif" font-size="15">learning loop</text>
</svg>
