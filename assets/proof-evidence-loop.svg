<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Proof and evidence loop</title>
  <desc id="desc">Public-safe proof loop showing validation, egress review, evidence, scorecard, handoff and next iteration.</desc>
  <rect width="980" height="360" rx="26" fill="#081018"/>
  <text x="54" y="62" fill="#F7F8FA" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="850">Proof / Evidence Loop</text>
  <text x="54" y="96" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Output becomes valuable when validation, evidence and handoff are explicit.</text>
  <path d="M204 242C214 138 356 130 456 174S656 270 770 182" fill="none" stroke="#4CE0B5" stroke-width="5" opacity=".55"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="850" font-size="14">
    <rect x="76" y="170" width="120" height="62" rx="15" fill="#11231F" stroke="#4CE0B5"/><text x="136" y="207" text-anchor="middle" fill="#E5FFF0">validation</text>
    <rect x="246" y="170" width="120" height="62" rx="15" fill="#111B2A" stroke="#71C7FF"/><text x="306" y="207" text-anchor="middle" fill="#E8F6FF">egress</text>
    <rect x="416" y="170" width="120" height="62" rx="15" fill="#241B0F" stroke="#FFC857"/><text x="476" y="207" text-anchor="middle" fill="#FFF4C7">evidence</text>
    <rect x="586" y="170" width="120" height="62" rx="15" fill="#151424" stroke="#A97CFF"/><text x="646" y="207" text-anchor="middle" fill="#F0E6FF">scorecard</text>
    <rect x="756" y="170" width="120" height="62" rx="15" fill="#171F24" stroke="#5CE1E6"/><text x="816" y="207" text-anchor="middle" fill="#DDFEFF">handoff</text>
  </g>
</svg>
