<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Aureus build menu map</title>
  <desc id="desc">Public-safe visual map of collaboration formats from unclear process to first useful system.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111F"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#06251F"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FE7D2"/>
      <stop offset="0.55" stop-color="#77C7FF"/>
      <stop offset="1" stop-color="#F7D77A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="520" rx="36" fill="url(#bg)"/>
  <path d="M92 370 C260 300 360 210 520 250 C675 290 745 180 900 220 C1038 256 1090 180 1190 112" fill="none" stroke="url(#line)" stroke-width="5" opacity="0.55"/>
  <text x="76" y="92" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44" font-weight="800">Build Menu</text>
  <text x="76" y="130" fill="#9FB0C3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19">Choose the smallest useful collaboration format with ownership, validation, and handoff.</text>
  <g filter="url(#shadow)">
    <rect x="76" y="188" width="190" height="118" rx="22" fill="#101923" stroke="#2C6F69"/>
    <text x="104" y="236" fill="#68F2D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Clarity Sprint</text>
    <text x="104" y="266" fill="#B6C3D1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">process first</text>
    <rect x="300" y="188" width="190" height="118" rx="22" fill="#101923" stroke="#315F87"/>
    <text x="328" y="236" fill="#91D8FF" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">AI Slice</text>
    <text x="328" y="266" fill="#B6C3D1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">review boundary</text>
    <rect x="524" y="188" width="190" height="118" rx="22" fill="#101923" stroke="#3D8B79"/>
    <text x="552" y="236" fill="#D9FFF5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Operating Tool</text>
    <text x="552" y="266" fill="#B6C3D1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">one control surface</text>
    <rect x="748" y="188" width="190" height="118" rx="22" fill="#101923" stroke="#8B6C2C"/>
    <text x="776" y="236" fill="#FFE28A" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Data Flow</text>
    <text x="776" y="266" fill="#B6C3D1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">documents to review</text>
    <rect x="972" y="188" width="210" height="118" rx="22" fill="#101923" stroke="#2C6F69"/>
    <text x="1000" y="236" fill="#68F2D8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Handoff</text>
    <text x="1000" y="266" fill="#B6C3D1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">operable later</text>
  </g>
  <g fill="none" stroke="#77C7FF" stroke-width="4" stroke-linecap="round" opacity="0.75">
    <path d="M266 247 H300"/>
    <path d="M490 247 H524"/>
    <path d="M714 247 H748"/>
    <path d="M938 247 H972"/>
  </g>
  <rect x="76" y="368" width="1120" height="64" rx="20" fill="#0C1320" stroke="#243447"/>
  <text x="108" y="408" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Rule: first useful scope, clear owner, validation path, public-safe handoff.</text>
</svg>
