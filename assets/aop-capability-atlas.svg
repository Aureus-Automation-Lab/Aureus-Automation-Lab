<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Aureus AOP Capability Atlas</title>
  <desc id="desc">Visual atlas showing how AOP, n8n workflows, GitHub delivery, agents, Antigravity supervisor bridge critique, Web Studio, FineCon Invoice, and evidence fit together.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#02060b"/><stop offset=".55" stop-color="#071624"/><stop offset="1" stop-color="#06120f"/></linearGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#ffe4a3"/><stop offset="1" stop-color="#d8922b"/></linearGradient>
    <linearGradient id="cyan" x1="0" x2="1"><stop offset="0" stop-color="#8beeff"/><stop offset="1" stop-color="#62f0c8"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="13" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="940" rx="44" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="96" y="102" fill="#f8fbff" font-size="54" font-weight="900">Aureus AOP Capability Atlas</text>
    <text x="100" y="146" fill="#9fb0c2" font-size="23" font-weight="700">How the public-safe GitHub system explains the operating platform.</text>
  </g>
  <g transform="translate(800 470)" filter="url(#glow)">
    <circle r="170" fill="#050b13" stroke="url(#gold)" stroke-width="2"/>
    <circle r="245" fill="none" stroke="#fff" stroke-opacity=".10"/>
    <circle r="330" fill="none" stroke="#62f0c8" stroke-opacity=".16" stroke-dasharray="10 18"/>
    <text text-anchor="middle" y="-8" fill="#f8fbff" font-family="Inter, Arial, sans-serif" font-size="74" font-weight="950">AOP</text>
    <text text-anchor="middle" y="40" fill="#9fb0c2" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Autonomous Operating Platform</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-weight="850" text-anchor="middle">
    <g transform="translate(390 250)"><rect x="-150" y="-64" width="300" height="128" rx="30" fill="#081923" stroke="#8beeff" stroke-opacity=".28"/><text y="-14" fill="#8beeff" font-size="23">GitHub Command</text><text y="24" fill="#9fb0c2" font-size="15">issues / PRs / review</text></g>
    <g transform="translate(800 170)"><rect x="-150" y="-64" width="300" height="128" rx="30" fill="#10170d" stroke="#ffe4a3" stroke-opacity=".32"/><text y="-14" fill="#ffe4a3" font-size="23">n8n Workflows</text><text y="24" fill="#9fb0c2" font-size="15">source / gates / handoff</text></g>
    <g transform="translate(1210 250)"><rect x="-150" y="-64" width="300" height="128" rx="30" fill="#081917" stroke="#62f0c8" stroke-opacity=".28"/><text y="-14" fill="#62f0c8" font-size="23">Antigravity Bridge</text><text y="24" fill="#9fb0c2" font-size="15">agy critique</text></g>
    <g transform="translate(320 590)"><rect x="-150" y="-64" width="300" height="128" rx="30" fill="#11131b" stroke="#fff" stroke-opacity=".14"/><text y="-14" fill="#f8fbff" font-size="23">Agent HQ</text><text y="24" fill="#9fb0c2" font-size="15">roles / trust zones</text></g>
    <g transform="translate(560 760)"><rect x="-150" y="-64" width="300" height="128" rx="30" fill="#10170d" stroke="#ffe4a3" stroke-opacity=".28"/><text y="-14" fill="#ffe4a3" font-size="23">FineCon / Invoice</text><text y="24" fill="#9fb0c2" font-size="15">document boundary</text></g>
    <g transform="translate(1040 760)"><rect x="-150" y="-64" width="300" height="128" rx="30" fill="#071b27" stroke="#8beeff" stroke-opacity=".26"/><text y="-14" fill="#8beeff" font-size="23">Web Studio</text><text y="24" fill="#9fb0c2" font-size="15">visual QA / pages</text></g>
    <g transform="translate(1280 590)"><rect x="-150" y="-64" width="300" height="128" rx="30" fill="#081917" stroke="#62f0c8" stroke-opacity=".28"/><text y="-14" fill="#62f0c8" font-size="23">Evidence Ledger</text><text y="24" fill="#9fb0c2" font-size="15">proof / egress / score</text></g>
  </g>
  <g fill="none" stroke-linecap="round" opacity=".82">
    <path d="M505 280C612 330 680 372 714 410" stroke="url(#cyan)" stroke-width="5"/>
    <path d="M800 235V300" stroke="url(#gold)" stroke-width="5"/>
    <path d="M1095 280C990 330 922 372 886 410" stroke="url(#cyan)" stroke-width="5"/>
    <path d="M450 590C565 560 628 528 664 494" stroke="url(#gold)" stroke-width="5"/>
    <path d="M632 706C690 610 725 564 744 538" stroke="url(#gold)" stroke-width="5"/>
    <path d="M968 706C910 610 875 564 856 538" stroke="url(#cyan)" stroke-width="5"/>
    <path d="M1150 590C1035 560 972 528 936 494" stroke="url(#cyan)" stroke-width="5"/>
  </g>
</svg>
