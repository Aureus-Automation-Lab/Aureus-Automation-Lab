name: Bug report
description: Report a reproducible problem in the public repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic examples only. Do not include customer data, credentials, access details, private URLs, or internal operating information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed problem in the public repository.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Provide minimal synthetic steps that a maintainer can reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Explain what you expected to happen.
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Public file or page
      description: Link or path to the affected public material, if known.
